[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheDryhtscipe/dreamcounter"

[workspace.dependencies]
rustc-hash = "2.1"
proptest = "1.12"
imbl = "7.0"
dc-core = { path = "crates/dc-core" }
dc-surface = { path = "crates/dc-surface" }
dc-eval = { path = "crates/dc-eval" }
dc-stitch = { path = "crates/dc-stitch" }
dc-tasks = { path = "crates/dc-tasks" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
