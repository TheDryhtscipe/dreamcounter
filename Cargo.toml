[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheDryhtscipe/dreamcounter"

[workspace.dependencies]
rustc-hash = "2.1"
proptest = "1.12"
imbl = "7.0"
# Pinned exactly: task inputs must be the same on every platform and version.
rand_chacha = { version = "=0.9.0", default-features = false }
dc-core = { path = "crates/dc-core" }
dc-surface = { path = "crates/dc-surface" }
dc-eval = { path = "crates/dc-eval" }
dc-stitch = { path = "crates/dc-stitch" }
dc-tasks = { path = "crates/dc-tasks" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1

# Tests run evaluator sweeps of millions of steps, about four times faster at
# opt-level 1 than unoptimised. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
