[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheDryhtscipe/dreamcounter"

[workspace.dependencies]
rustc-hash = "2.1"
foldhash = "0.2"
proptest = "1.12"
imbl = "7.0"
# Pinned exactly: task inputs must be the same on every platform and version.
rand_chacha = { version = "=0.9.0", default-features = false }
dc-core = { path = "crates/dc-core" }
dc-surface = { path = "crates/dc-surface" }
dc-eval = { path = "crates/dc-eval" }
dc-stitch = { path = "crates/dc-stitch" }
dc-tasks = { path = "crates/dc-tasks" }
dc-compress = { path = "crates/dc-compress" }
rmcp = { version = "3.10", default-features = false }
schemars = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
# The Stitch worker sets its own resource limits (dc-compress).
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
tokio = { version = "1", default-features = false }
# Pinned to one commit: the Stitch bridge (dc-compress) is tested against it.
stitch_core = { git = "https://github.com/mlb2251/stitch", rev = "350804b7b35807c78bd21c313785ae5152ae2985" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1

# `cargo test` (not `--release`) builds every crate, dependencies included,
# at opt-level 1 with debug assertions and overflow checks on. The evaluator
# sweeps in the tests run about four times faster than unoptimised. Stack-depth
# tests now run with optimised frames.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
