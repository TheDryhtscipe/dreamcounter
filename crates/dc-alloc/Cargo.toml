[package]
name = "dc-alloc"
description = "Global allocator that counts each thread's live heap bytes, for the evaluator's memory limit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The workspace forbids unsafe code. Implementing `GlobalAlloc` needs it, so
# this crate denies it instead, and allows it only on that one impl.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
